
name: iOS Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          DIR="$GITHUB_WORKSPACE"

          for i in 1 2 3; do
            if find "$DIR" -name package.json \
              -not -path '*/node_modules/*' | grep -q .; then
              break
            fi

            ZIP=$(find "$DIR" -name '*.zip' -print -quit)
            if [ -z "$ZIP" ]; then
              echo "Project archive not found"
              exit 1
            fi

            OUT="$GITHUB_WORKSPACE/extracted-$i"
            mkdir -p "$OUT"
            unzip -q "$ZIP" -d "$OUT"
            DIR="$OUT"
          done

          PACKAGE=$(find "$DIR" -name package.json \
            -not -path '*/node_modules/*' -print -quit)

          test -n "$PACKAGE"
          echo "PROJECT_DIR=$(dirname "$PACKAGE")" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci

      - name: Initialize iOS
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            npx tauri ios init --ci
          fi

      - name: Build iOS archive
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx tauri ios build \
            --target aarch64 \
            --no-sign \
            --archive-only \
            --ci \
            --verbose

      - name: Verify archive
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          ARCHIVE=$(find src-tauri/gen/apple/build \
            -name '*.xcarchive' -type d -print -quit)

          if [ -z "$ARCHIVE" ]; then
            echo "No iOS archive found"
            find src-tauri/gen/apple/build -maxdepth 6 -print
            exit 1
          fi

          APP=$(find "$ARCHIVE/Products/Applications" \
            -maxdepth 1 -name '*.app' -type d -print -quit)

          test -n "$APP"
          test -f "$APP/Info.plist"

          mkdir -p "$GITHUB_WORKSPACE/unsigned-build"
          ditto "$ARCHIVE" \
            "$GITHUB_WORKSPACE/unsigned-build/App.xcarchive"

          echo "Archive verified: $APP"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: bAJlbesRoute-iOS-unsigned-archive
          path: unsigned-build/App.xcarchive
          if-no-files-found: error
          retention-days: 14
