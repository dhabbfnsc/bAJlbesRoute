
name: iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_DIR="$GITHUB_WORKSPACE"
          PROJECT_DIR=""

          for DEPTH in 1 2 3 4; do
            PACKAGE_JSON=$(find "$SEARCH_DIR" \
              -type f \
              -name package.json \
              -not -path '*/node_modules/*' \
              -print -quit)

            if [ -n "$PACKAGE_JSON" ]; then
              PROJECT_DIR=$(dirname "$PACKAGE_JSON")
              break
            fi

            ZIP_FILE=$(find "$SEARCH_DIR" \
              -type f \
              -name '*.zip' \
              -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Project ZIP was not found."
              exit 1
            fi

            EXTRACT_DIR="$GITHUB_WORKSPACE/.ios-source-$DEPTH"
            mkdir -p "$EXTRACT_DIR"

            echo "Extracting: $ZIP_FILE"
            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            SEARCH_DIR="$EXTRACT_DIR"
          done

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json was not found after extraction."
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ${{ env.PROJECT_DIR }}/src-tauri -> target

      - name: Install JavaScript dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci

      - name: Initialize iOS project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "src-tauri/gen/apple" ]; then
            npx tauri ios init --ci
          fi

          if [ ! -d "src-tauri/gen/apple" ]; then
            echo "ERROR: Tauri did not generate the iOS project."
            exit 1
          fi

      - name: Build unsigned IPA with Tauri
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          npx tauri ios build --ci --no-sign --verbose

      - name: Find and prepare IPA
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="src-tauri/gen/apple/build"

          IPA_FILE=$(find "$BUILD_DIR" \
            -type f \
            -name '*.ipa' \
            -print -quit)

          if [ -z "$IPA_FILE" ]; then
            echo "ERROR: IPA was not generated."
            echo "Build directory contents:"
            find "$BUILD_DIR" -maxdepth 7 -print || true
            exit 1
          fi

          echo "Found IPA: $IPA_FILE"

          cp "$IPA_FILE" "$GITHUB_WORKSPACE/bAJlbesRoute-unsigned.ipa"

          test -s "$GITHUB_WORKSPACE/bAJlbesRoute-unsigned.ipa"

          echo "IPA successfully prepared."
          ls -lh "$GITHUB_WORKSPACE/bAJlbesRoute-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: bAJlbesRoute-iOS-unsigned
          path: bAJlbesRoute-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bAJlbesRoute-unsigned.ipa
          draft: true
